<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gift Card</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@300;400;500&display=swap">
<style>
:root{--bg:#F3F3F3;--brown:#8B5A45;--pink:#C48B80;--w:min(76vw,300px);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);font-family:'Jost','Helvetica Neue',Arial,sans-serif;color:var(--brown)}
body{min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 16px;overflow-x:hidden}
.title{font-size:30px;font-weight:400;letter-spacing:.04em;text-align:center;margin:0;line-height:1.1}
.stage{position:relative;padding-top:12px;margin-top:6px;transition:padding-top .9s cubic-bezier(.2,.8,.2,1)}.open .stage{padding-top:calc(var(--w)*1.22*.62)}
.env{position:relative;width:var(--w);aspect-ratio:520/635;cursor:pointer;animation:float 3.2s ease-in-out infinite}
.env img{width:100%;height:100%;display:block;user-select:none;-webkit-user-drag:none;pointer-events:none}
.card{position:absolute;left:15.06%;top:12.3%;width:69.7%;height:57.7%;background:#F2F2F2;z-index:2;
 -webkit-clip-path:polygon(0 0,100% 0,100% 68.9%,75.9% 100%,25.3% 100%,0 60.9%);clip-path:polygon(0 0,100% 0,100% 68.9%,75.9% 100%,25.3% 100%,0 60.9%);
 transition:left .9s cubic-bezier(.2,.8,.2,1),top .9s cubic-bezier(.2,.8,.2,1),width .9s cubic-bezier(.2,.8,.2,1),height .9s cubic-bezier(.2,.8,.2,1),background .6s,clip-path .9s,box-shadow .9s;
 display:flex;align-items:center;justify-content:center;padding:0 8%}
.front{position:absolute;left:0;right:0;top:9%;text-align:center;color:var(--brown);transition:opacity .3s}.front .big{font-size:calc(var(--w)*.07);letter-spacing:.03em;line-height:1.2;margin-bottom:8px}.front .sm{font-size:calc(var(--w)*.04);font-weight:300;letter-spacing:.05em;line-height:1.5;color:var(--pink);animation:pulse 2s ease-in-out infinite}.open .front .sm{animation:none}.open .front{opacity:0}
.inner{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
.inner>*{opacity:0;transform:translateY(8px);transition:opacity .6s,transform .6s}
.open .card{left:-9%;top:-62%;width:118%;height:112%;background:#fff;-webkit-clip-path:polygon(0 0,100% 0,100% 100%,100% 100%,0 100%,0 100%);clip-path:polygon(0 0,100% 0,100% 100%,100% 100%,0 100%,0 100%);box-shadow:0 10px 30px rgba(139,90,69,.18)}
.open .inner>*{opacity:1;transform:none}
.open .inner>*:nth-child(1){transition-delay:.55s}.open .inner>*:nth-child(2){transition-delay:.65s}.open .inner>*:nth-child(3){transition-delay:.75s}
.open .inner>*:nth-child(4){transition-delay:.85s}.open .inner>*:nth-child(5){transition-delay:.95s}.open .inner>*:nth-child(6){transition-delay:1.05s}.open .inner>*:nth-child(7){transition-delay:1.15s}
.open .env{animation:none}
.handle{font-size:11px;letter-spacing:.14em;margin-bottom:14px}
.gc{font-size:34px;font-weight:400;letter-spacing:.12em;line-height:1;margin-bottom:12px}
.small{font-size:13px;font-weight:300;line-height:1.4}
.service{font-size:22px;color:var(--pink);font-weight:400;margin:6px 0 14px;line-height:1.15}
.gift{font-size:15px;font-weight:500;border-top:1px solid var(--pink);border-bottom:1px solid var(--pink);padding:8px 10px;margin-bottom:14px;color:var(--brown)}
.inner a{color:inherit;text-decoration:underline;pointer-events:none}.open .inner a{pointer-events:auto}
.foot{font-size:11px;letter-spacing:.04em;line-height:1.5}
.hint{margin-top:18px;font-size:14px;letter-spacing:.06em;color:var(--pink);text-align:center;line-height:1.6;animation:pulse 2s ease-in-out infinite}.sub{font-size:13px;font-weight:300}
.open .hint{animation:none;opacity:.7}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
@keyframes pulse{0%,100%{opacity:.45}50%{opacity:1}}
@media (prefers-reduced-motion:reduce){.env,.hint{animation:none}.card,.card>*{transition-duration:.01s!important;transition-delay:0s!important}}
</style>
</head>
